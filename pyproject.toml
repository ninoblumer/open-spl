[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soundlevelmeter"
version = "0.3.0"
description = "IEC 61672-1 Sound Level Meter"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Nino Blumer" }]
keywords = ["sound level meter", "acoustics", "IEC 61672", "audio", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "sounddevice",
    "phonometry",
    "numba",
]

[project.urls]
Repository = "https://github.com/ninoblumer/python-soundlevelmeter"

[project.scripts]
slm = "slm.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["slm"]
omit = [
    # Entry-point glue (argparse wiring) exercised via subprocess, not imports.
    "*/__main__.py",
]